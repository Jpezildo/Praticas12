<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
 <meta charset="UTF-8"> 
 <meta name="viewport" content="width=device-width, 
initial-scale=1.0"> 
 <title>A-note</title> 
 <style> 
   * { 
     margin: 0; 
     padding: 0; 
     box-sizing: border-box; 
   } 
  
   body { 
     font-family: Georgia, serif; 
     background-color: #f0ece8; 
     min-height: 100vh; 
   } 
  
   header { 
     background-color: #f2cd57; 
     padding: 14px 28px; 
     display: flex; 
     justify-content: space-between; 
     align-items: center; 
     border-bottom: 2px solid #d4a832; 
   } 
  
   header img.logo { 
     width: 40px; 
     height: 40px; 
     object-fit: contain; 
   } 
  
   header a { 
     background: none; 
     border: none; 
     cursor: pointer; 
     padding: 6px; 
     border-radius: 50%; 
     display: flex; 
     align-items: center; 
     justify-content: center; 
     transition: background-color 0.2s; 
     text-decoration: none; 
   } 
  
   header a:hover { 
     background-color: rgba(0, 0, 0, 0.1); 
   } 
  
   header a svg { 
     width: 32px; 
     height: 32px; 
     stroke: #3d2b00; 
     fill: none; 
     stroke-width: 1.8; 
   } 
  
   main { 
     display: flex; 
     align-items: center; 
     justify-content: center; 
     gap: 60px; 
     padding: 80px 60px; 
     min-height: calc(100vh - 70px); 
   } 
  
   section { 
     display: flex; 
     flex-direction: column; 
     align-items: flex-start; 
     gap: 16px; 
     max-width: 340px; 
   } 
  
   section h1 { 
     font-size: 2.4rem; 
     font-weight: 700; 
     color: #2c1a00; 
     line-height: 1.2; 
     margin-bottom: 8px; 
   } 
  
   section button { 
     width: 100%; 
     padding: 14px 0; 
     background-color: #3d4a3e; 
     color: #ffffff; 
     font-size: 1rem; 
     font-family: Georgia, serif; 
     border: none; 
     border-radius: 30px; 
     cursor: pointer; 
     transition: background-color 0.2s, transform 0.1s; 
   } 
  
   section button:hover { 
     background-color: #2e382f; 
   } 
  
   section button:active { 
     transform: scale(0.98); 
   } 
  
   section p { 
     font-size: 0.9rem; 
     color: #5a4a30; 
     margin-top: 4px; 
     align-self: center; 
   } 
  
   aside { 
     flex-shrink: 0; 
   } 
  
   aside img { 
     width: 300px; 
     height: 320px; 
     object-fit: cover; 
     border-radius: 12px; 
     box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); 
   } 
   .btn {
  display: block;
  width: 100%;
  padding: 14px 0;
  background-color: #3d4a3e;
  color: #ffffff;
  font-size: 1rem;
  font-family: Georgia, serif;
  border: none;
  border-radius: 30px;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
}

.btn:hover {
  background-color: #2e382f;
}

.btn:active {
  transform: scale(0.98);
}
 </style> 
</head> 
<body> 
  
 <header> 
   <img class="logo" src="img/logo.png" alt="Logo A-note"> 
  
   <a href="perfil.html"> 
     <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"> 
       <circle cx="12" cy="8" r="4"/> 
       <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/> 
     </svg> 
   </a> 
 </header> 
<main> 
<section> 
<h1>Bem-vindo ao A-note!</h1> 
<a href="login.html" class="btn">Login</a>

<p>Não tem cadastro?</p> 

<a href="cadastro.html" class="btn">Cadastre-se</a>
</section> 
<aside> 
<img src="img/foto.jpg" alt="Pessoa escrevendo em um caderno"> 
</aside> 
</main> 
</body> 
</html>
